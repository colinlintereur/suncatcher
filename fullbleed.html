<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Suncatcher M1 Live Tracker (4K Full-Bleed 16:9 N2YO + Upcoming Passes)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/5.0.0/satellite.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: black;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
iframe#w {
  position: absolute;
  top: 0;
  left: 0;
  width: 800px;
  height: 580px;
  border: 0;
  transform: scale(4.8, 3.724138);
  transform-origin: 0 0;
}
.passes-card {
  position: absolute;
  bottom: 36px;
  left: 36px;
  z-index: 999;
  width: 1120px;
  background: rgba(11, 17, 30, 0.90);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 2px solid #374151;
  border-radius: 18px;
  padding: 26px 30px 22px 30px;
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.85);
  color: #f3f4f6;
  transform-origin: bottom left;
}
.passes-title {
  font-size: 30px;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: -0.01em;
  margin-bottom: 16px;
}
.passes-table {
  width: 100%;
  border-collapse: collapse;
}
.passes-table thead tr {
  background: rgba(31, 41, 55, 0.5);
  border-bottom: 2px solid #4b5563;
}
.passes-table th {
  padding: 13px 18px;
  font-size: 17px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #d1d5db;
  text-align: left;
}
.passes-table th.col-max {
  color: #60a5fa;
  text-align: center;
}
.passes-table th.col-dur {
  text-align: center;
}
.passes-table tbody tr {
  border-left: 4px solid transparent;
}
.passes-table tbody tr.tier-emerald {
  background: rgba(6, 78, 59, 0.16);
  border-left-color: rgba(16, 185, 129, 0.8);
}
.passes-table tbody tr.tier-yellow {
  background: rgba(113, 63, 18, 0.16);
  border-left-color: rgba(234, 179, 8, 0.8);
}
.passes-table tbody tr.tier-orange {
  background: rgba(124, 45, 18, 0.16);
  border-left-color: rgba(249, 115, 22, 0.8);
}
.passes-table td {
  padding: 11px 18px;
  font-size: 21px;
  white-space: nowrap;
}
.date-text {
  color: #e5e7eb;
  font-weight: 500;
}
.time-text {
  color: #9ca3af;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 19px;
  margin-left: 12px;
}
.az-text {
  color: #d1d5db;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 20px;
}
.alt-cell {
  text-align: center;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 25px;
  font-weight: 700;
  color: #d1d5db;
}
.tier-emerald .alt-cell { color: #34d399; }
.tier-yellow .alt-cell { color: #facc15; }
.tier-orange .alt-cell { color: #fb923c; }
.dur-cell {
  text-align: center;
}
.dur-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 5px 16px;
  background: rgba(55, 65, 81, 0.6);
  border-radius: 9999px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 18px;
  color: #d1d5db;
}
.passes-footer {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid #4b5563;
  text-align: center;
  font-size: 18px;
  color: #9ca3af;
}
</style>
</head>
<body>
<iframe id="w" src="https://www.n2yo.com/widgets/widget-tracker.php?s=100902&size=large&all=0&map=2&foot=1" scrolling="no"></iframe>
<div class="passes-card" id="passes-card">
  <h2 class="passes-title">Upcoming Passes</h2>
  <table class="passes-table">
    <thead>
      <tr>
        <th id="col-datetime-header">Date &amp; Time</th>
        <th>Rise</th>
        <th class="col-max">Max Alt</th>
        <th>Set</th>
        <th class="col-dur">Duration</th>
      </tr>
    </thead>
    <tbody id="passes-tbody"></tbody>
  </table>
  <div class="passes-footer" id="passes-footer">Computing passes...</div>
</div>
<script>
function fit() {
  const f = document.getElementById("w");
  const card = document.getElementById("passes-card");
  const w = window.innerWidth || 3840;
  const h = window.innerHeight || 2160;
  if (f) {
    const sx = w / 800 || 4.8;
    const sy = h / 580 || 3.724138;
    f.style.transform = "scale(" + sx + ", " + sy + ")";
  }
  if (card) {
    const cs = Math.min(w / 3840, h / 2160);
    card.style.transform = "scale(" + cs + ")";
  }
}
window.addEventListener("resize", fit);
fit();
</script>
<script src="passes.js"></script>
</body>
</html>

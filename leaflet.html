<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Suncatcher M1 Live Tracker (4K Native Leaflet + Upcoming Passes)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/5.0.0/satellite.min.js"></script>
<script src="https://unpkg.com/@joergdietrich/leaflet.terminator"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: black;
  overflow: hidden;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
div[id=m] { width: 100vw; height: 100vh; }
div[id=h] {
  position: absolute;
  top: 30px;
  right: 30px;
  z-index: 999;
  background: rgba(11, 17, 30, 0.90);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: white;
  padding: 22px 30px;
  border-radius: 16px;
  font: 24px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  border: 2px solid #374151;
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.75);
}
.i {
  width: 36px;
  height: 36px;
  background: red;
  border: 4px solid white;
  border-radius: 99px;
  box-sizing: border-box;
  box-shadow: 0 0 16px red;
}
.passes-card {
  position: absolute;
  bottom: 36px;
  left: 36px;
  z-index: 999;
  width: 1120px;
  background: rgba(11, 17, 30, 0.90);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 2px solid #374151;
  border-radius: 18px;
  padding: 26px 30px 22px 30px;
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.85);
  color: #f3f4f6;
  transform-origin: bottom left;
}
.passes-title {
  font-size: 30px;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: -0.01em;
  margin-bottom: 16px;
}
.passes-table {
  width: 100%;
  border-collapse: collapse;
}
.passes-table thead tr {
  background: rgba(31, 41, 55, 0.5);
  border-bottom: 2px solid #4b5563;
}
.passes-table th {
  padding: 13px 18px;
  font-size: 17px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #d1d5db;
  text-align: left;
}
.passes-table th.col-max {
  color: #60a5fa;
  text-align: center;
}
.passes-table th.col-dur {
  text-align: center;
}
.passes-table tbody tr {
  border-left: 4px solid transparent;
}
.passes-table tbody tr.tier-emerald {
  background: rgba(6, 78, 59, 0.16);
  border-left-color: rgba(16, 185, 129, 0.8);
}
.passes-table tbody tr.tier-yellow {
  background: rgba(113, 63, 18, 0.16);
  border-left-color: rgba(234, 179, 8, 0.8);
}
.passes-table tbody tr.tier-orange {
  background: rgba(124, 45, 18, 0.16);
  border-left-color: rgba(249, 115, 22, 0.8);
}
.passes-table td {
  padding: 11px 18px;
  font-size: 21px;
  white-space: nowrap;
}
.date-text {
  color: #e5e7eb;
  font-weight: 500;
}
.time-text {
  color: #9ca3af;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 19px;
  margin-left: 12px;
}
.az-text {
  color: #d1d5db;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 20px;
}
.alt-cell {
  text-align: center;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 25px;
  font-weight: 700;
  color: #d1d5db;
}
.tier-emerald .alt-cell { color: #34d399; }
.tier-yellow .alt-cell { color: #facc15; }
.tier-orange .alt-cell { color: #fb923c; }
.dur-cell {
  text-align: center;
}
.dur-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 5px 16px;
  background: rgba(55, 65, 81, 0.6);
  border-radius: 9999px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 18px;
  color: #d1d5db;
}
.passes-footer {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid #4b5563;
  text-align: center;
  font-size: 18px;
  color: #9ca3af;
}
</style>
</head>
<body>
<div id="m"></div>
<div id="h"></div>
<div class="passes-card" id="passes-card">
  <h2 class="passes-title">Upcoming Passes</h2>
  <table class="passes-table">
    <thead>
      <tr>
        <th id="col-datetime-header">Date &amp; Time</th>
        <th>Rise</th>
        <th class="col-max">Max Alt</th>
        <th>Set</th>
        <th class="col-dur">Duration</th>
      </tr>
    </thead>
    <tbody id="passes-tbody"></tbody>
  </table>
  <div class="passes-footer" id="passes-footer">Computing passes...</div>
</div>
<script src="passes.js"></script>
<script>
const m = L.map("m", { zoomControl: false, attributionControl: false }).setView([0, 0], 4);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/NatGeo_World_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom: 13 }).addTo(m);
const term = L.terminator().addTo(m);

let k = null;
let c = null;
let trackLines = [];

function propAt(d) {
  const satrec = window.SuncatcherPasses && window.SuncatcherPasses.getSatrec();
  if (!satrec || typeof window.satellite === "undefined") return null;
  const v = window.satellite.propagate(satrec, d);
  if (!v || !v.position || v.error) return null;
  const g = window.satellite.eciToGeodetic(v.position, window.satellite.gstime(d));
  return {
    lt: window.satellite.degreesLat(g.latitude),
    lg: window.satellite.degreesLong(g.longitude),
    a: g.height,
    s: Math.sqrt(398600.8 / (g.height + 6378.135))
  };
}

function updateOrbitAndTerminator() {
  const now = new Date();
  const segments = [[]];
  let segIdx = 0;
  for (let t = -45; t <= 45; t++) {
    const q = propAt(new Date(now.getTime() + 60000 * t));
    if (q) {
      const curSeg = segments[segIdx];
      if (curSeg.length && Math.abs(q.lg - curSeg[curSeg.length - 1][1]) > 180) {
        segments[++segIdx] = [];
      }
      segments[segIdx].push([q.lt, q.lg]);
    }
  }
  trackLines.forEach(line => m.removeLayer(line));
  trackLines = segments
    .filter(seg => seg.length > 1)
    .map(seg => L.polyline(seg, { color: "red", weight: 4, opacity: 0.7 }).addTo(m));

  try {
    const updatedTerm = L.terminator({ time: now });
    term.setLatLngs(updatedTerm.getLatLngs());
  } catch (_) {}

  const curPos = propAt(now);
  if (curPos) {
    m.panTo([Math.max(-58, Math.min(58, curPos.lt)), curPos.lg], { animate: false });
  }
}

function updatePositionTick() {
  const q = propAt(new Date());
  if (!q) return;
  const l = [q.lt, q.lg];
  const r = 6375 * Math.asin(Math.sqrt(q.a * (q.a + 12750)) / (6375 + q.a)) * 1000;
  if (!k) {
    k = L.marker(l, { icon: L.divIcon({ className: "i", iconSize: [36, 36], iconAnchor: [18, 18] }) }).addTo(m);
    c = L.circle(l, { radius: r, color: "red", fillColor: "pink", fillOpacity: 0.25, weight: 3 }).addTo(m);
    m.setView([Math.max(-58, Math.min(58, q.lt)), q.lg], 4);
  } else {
    k.setLatLng(l);
    c.setLatLng(l);
    c.setRadius(r);
  }
  document.getElementById("h").innerHTML = "<b style='font-size:26px;color:#60a5fa;'>PROJECT SUNCATCHER-M1</b><br>LAT: " + q.lt.toFixed(2) + "&deg;<br>LNG: " + q.lg.toFixed(2) + "&deg;<br>ALT: " + q.a.toFixed(1) + " km<br>SPD: " + q.s.toFixed(2) + " km/s";
}

function fitCard() {
  const card = document.getElementById("passes-card");
  if (!card) return;
  const w = window.innerWidth || 3840;
  const h = window.innerHeight || 2160;
  const cs = Math.min(w / 3840, h / 2160);
  card.style.transform = "scale(" + cs + ")";
}
window.addEventListener("resize", fitCard);
fitCard();

updateOrbitAndTerminator();
updatePositionTick();
setInterval(updatePositionTick, 1000);
setInterval(updateOrbitAndTerminator, 30000);
if (window.SuncatcherPasses) {
  window.SuncatcherPasses.onTleUpdate(() => {
    updateOrbitAndTerminator();
    updatePositionTick();
  });
}
</script>
</body>
</html>

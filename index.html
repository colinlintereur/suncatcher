<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Suncatcher M1 Live Tracker &amp; Upcoming Passes (4K)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/5.0.0/satellite.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #050811;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: #f3f4f6;
  display: flex;
  justify-content: center;
  align-items: center;
}
#stage {
  width: 3840px;
  height: 2160px;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  padding: 44px 48px;
  gap: 44px;
  transform-origin: center center;
  flex-shrink: 0;
}
.map-pane {
  width: 2480px;
  height: 2072px;
  background: #000;
  border: 2px solid #1f2937;
  border-radius: 22px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
  flex-shrink: 0;
}
iframe#w {
  position: absolute;
  top: 0;
  left: 0;
  width: 800px;
  height: 580px;
  border: 0;
  transform: scale(3.1, 3.5724);
  transform-origin: 0 0;
}
.passes-card {
  width: 1220px;
  height: 2072px;
  background: linear-gradient(180deg, #111827 0%, #0b111e 100%);
  border: 2px solid #374151;
  border-radius: 22px;
  padding: 48px 44px 40px 44px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  flex-shrink: 0;
}
.passes-top {
  display: flex;
  flex-direction: column;
  flex: 1;
}
.passes-title {
  font-size: 44px;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: -0.01em;
  margin-bottom: 32px;
}
.passes-table {
  width: 100%;
  border-collapse: collapse;
  flex: 1;
}
.passes-table thead tr {
  background: rgba(31, 41, 55, 0.45);
  border-bottom: 2px solid #4b5563;
}
.passes-table th {
  padding: 26px 24px;
  font-size: 21px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #d1d5db;
  text-align: left;
}
.passes-table th.col-max {
  color: #60a5fa;
  text-align: center;
}
.passes-table th.col-dur {
  text-align: center;
}
.passes-table tbody tr {
  transition: background-color 0.15s ease;
  border-left: 6px solid transparent;
}
.passes-table tbody tr.tier-emerald {
  background: rgba(6, 78, 59, 0.15);
  border-left-color: rgba(16, 185, 129, 0.8);
}
.passes-table tbody tr.tier-yellow {
  background: rgba(113, 63, 18, 0.15);
  border-left-color: rgba(234, 179, 8, 0.8);
}
.passes-table tbody tr.tier-orange {
  background: rgba(124, 45, 18, 0.15);
  border-left-color: rgba(249, 115, 22, 0.8);
}
.passes-table td {
  padding: 38px 24px;
  font-size: 29px;
  white-space: nowrap;
}
.date-text {
  color: #e5e7eb;
  font-weight: 500;
}
.time-text {
  color: #9ca3af;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  font-size: 26px;
  margin-left: 16px;
}
.az-text {
  color: #d1d5db;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  font-size: 27px;
}
.alt-cell {
  text-align: center;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  font-size: 36px;
  font-weight: 700;
  color: #d1d5db;
}
.tier-emerald .alt-cell { color: #34d399; }
.tier-yellow .alt-cell { color: #facc15; }
.tier-orange .alt-cell { color: #fb923c; }
.dur-cell {
  text-align: center;
}
.dur-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 10px 24px;
  background: rgba(55, 65, 81, 0.55);
  border-radius: 9999px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  font-size: 24px;
  color: #d1d5db;
}
.passes-footer {
  margin-top: 24px;
  padding-top: 28px;
  border-top: 2px solid #4b5563;
  text-align: center;
  font-size: 24px;
  color: #9ca3af;
}
</style>
</head>
<body>
<div id="stage">
  <div class="map-pane">
    <iframe id="w" src="https://www.n2yo.com/widgets/widget-tracker.php?s=100902&size=large&all=0&map=2&foot=1" scrolling="no"></iframe>
  </div>
  <div class="passes-card">
    <div class="passes-top">
      <h2 class="passes-title">Upcoming Passes</h2>
      <table class="passes-table">
        <thead>
          <tr>
            <th id="col-datetime-header">Date &amp; Time</th>
            <th>Rise</th>
            <th class="col-max">Max Alt</th>
            <th>Set</th>
            <th class="col-dur">Duration</th>
          </tr>
        </thead>
        <tbody id="passes-tbody"></tbody>
      </table>
    </div>
    <div class="passes-footer" id="passes-footer">Computing passes...</div>
  </div>
</div>
<script>
function fitStage() {
  const stage = document.getElementById("stage");
  if (!stage) return;
  const w = window.innerWidth || 3840;
  const h = window.innerHeight || 2160;
  const s = Math.min(w / 3840, h / 2160);
  stage.style.transform = "scale(" + s + ")";
}
window.addEventListener("resize", fitStage);
fitStage();
</script>
<script src="passes.js"></script>
</body>
</html>
